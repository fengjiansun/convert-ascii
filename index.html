<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Generator & Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #0a0a0a;
            color: #0F0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        
        .main-container {
            display: flex;
            height: 100vh;
        }
        
        /* 左侧生成参数面板 */
        .generation-panel {
            width: 350px;
            background: rgba(15, 15, 15, 0.95);
            border-right: 2px solid #0F0;
            overflow-y: auto;
            padding: 20px;
        }
        
        /* 中间ASCII显示区域 */
        .ascii-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }
        
        /* 右侧渲染参数面板 */
        .render-panel {
            width: 280px;
            background: rgba(20, 20, 20, 0.95);
            border-left: 2px solid #0F0;
            overflow-y: auto;
            padding: 20px;
        }
        
        #ascii-art {
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            line-height: 1.0;
            white-space: pre;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        /* 控制组样式 */
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #0F0;
            font-size: 14px;
            font-weight: bold;
        }
        
        .control-group input, .control-group select, .control-group textarea {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #0F0;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        
        .control-group input[type="range"] {
            height: 6px;
            background: #333;
            outline: none;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: #0F0;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .control-group input[type="color"] {
            height: 40px;
            border: none;
            cursor: pointer;
        }
        
        .control-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        
        .value-display {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        /* 按钮样式 */
        .btn {
            padding: 12px 20px;
            background: #0F0;
            border: none;
            border-radius: 4px;
            color: #000;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #0d0;
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #666;
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: #777;
        }
        
        .btn-danger {
            background: #ff4444;
            color: #fff;
        }
        
        .btn-danger:hover {
            background: #ff6666;
        }
        
        /* 进度条样式 */
        .progress-container {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #0F0;
            border-radius: 4px;
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0F0, #0d0);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        
        .progress-text {
            color: #0F0;
            font-size: 12px;
            text-align: center;
        }
        
        /* 状态显示 */
        .status {
            padding: 10px;
            background: rgba(15, 255, 15, 0.1);
            border: 1px solid #0F0;
            border-radius: 4px;
            color: #0F0;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .status.error {
            background: rgba(255, 68, 68, 0.1);
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .status.success {
            background: rgba(68, 255, 68, 0.1);
            border-color: #44ff44;
            color: #44ff44;
        }
        
        /* 标题样式 */
        h2 {
            color: #0F0;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 2px solid #0F0;
            padding-bottom: 10px;
        }
        
        h3 {
            color: #0F0;
            margin: 20px 0 15px 0;
            font-size: 16px;
        }
        
        /* 文件选择区域 */
        .file-selection {
            border: 2px dashed #0F0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .file-selection:hover {
            background: rgba(15, 255, 15, 0.05);
        }
        
        .file-selection input[type="file"] {
            display: none;
        }
        
        .file-selection label {
            cursor: pointer;
            color: #0F0;
            font-size: 14px;
        }
        
        /* 渲染控制样式 */
        .play-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .play-controls .btn {
            flex: 1;
            margin-bottom: 0;
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #222;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #0F0;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #0d0;
        }
        
        /* 选项卡切换 */
        .tab-container {
            margin-bottom: 20px;
        }
        
        .tab-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        
        .tab-btn {
            padding: 8px 16px;
            background: #333;
            border: 1px solid #555;
            color: #ccc;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            font-size: 12px;
        }
        
        .tab-btn.active {
            background: #0F0;
            color: #000;
            border-color: #0F0;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 左侧生成参数面板 -->
        <div class="generation-panel">
            <h2>🎬 ASCII 帧生成器</h2>
            
            <!-- 文件选择 -->
            <div class="control-group">
                <label>选择视频文件</label>
                <div class="file-selection">
                    <input type="file" id="videoFile" accept="video/*">
                    <label for="videoFile">
                        点击选择视频文件<br>
                        <small>或使用默认的 bottom-banner.mp4</small>
                    </label>
                    <div id="selectedFile" class="value-display"></div>
                </div>
            </div>
            
            <!-- 生成状态 -->
            <div class="status" id="generationStatus">
                等待开始生成...
            </div>
            
            <!-- 进度条 -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-text" id="progressText">准备中...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="value-display" id="progressDetail">0/0 帧</div>
            </div>
            
            <!-- 生成控制按钮 -->
            <button class="btn" id="generateBtn">🚀 开始生成</button>
            <button class="btn btn-danger" id="cancelBtn" disabled>❌ 取消生成</button>
            
            <!-- 选项卡容器 -->
            <div class="tab-container">
                <div class="tab-buttons">
                    <div class="tab-btn active" data-tab="basic">基础设置</div>
                    <div class="tab-btn" data-tab="advanced">高级设置</div>
                    <div class="tab-btn" data-tab="charset">字符集</div>
                </div>
                
                <!-- 基础设置选项卡 -->
                <div class="tab-content active" id="tab-basic">
                    <div class="control-group">
                        <label for="frameWidth">输出宽度 (字符数)</label>
                        <input type="range" id="frameWidth" min="20" max="200" value="100">
                        <div class="value-display" id="frameWidthValue">100 字符</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="frameHeight">输出高度 (留空自动计算)</label>
                        <input type="number" id="frameHeight" placeholder="自动计算">
                        <div class="value-display">留空将按比例自动计算高度</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="brightness">亮度调整</label>
                        <input type="range" id="brightness" min="0.1" max="3.0" step="0.1" value="1.0">
                        <div class="value-display" id="brightnessValue">1.0</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="contrast">对比度调整</label>
                        <input type="range" id="contrast" min="0.1" max="3.0" step="0.1" value="1.0">
                        <div class="value-display" id="contrastValue">1.0</div>
                    </div>
                </div>
                
                <!-- 高级设置选项卡 -->
                <div class="tab-content" id="tab-advanced">
                    <div class="control-group">
                        <label for="gamma">伽马值</label>
                        <input type="range" id="gamma" min="0.1" max="3.0" step="0.1" value="1.0">
                        <div class="value-display" id="gammaValue">1.0</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="saturation">饱和度</label>
                        <input type="range" id="saturation" min="0.0" max="2.0" step="0.1" value="1.0">
                        <div class="value-display" id="saturationValue">1.0</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="sharpness">锐度</label>
                        <input type="range" id="sharpness" min="0.0" max="2.0" step="0.1" value="1.0">
                        <div class="value-display" id="sharpnessValue">1.0</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="startTime">开始时间 (秒)</label>
                        <input type="number" id="startTime" min="0" step="0.1" value="0">
                    </div>
                    
                    <div class="control-group">
                        <label for="duration">处理时长 (秒，留空处理全部)</label>
                        <input type="number" id="duration" min="0.1" step="0.1" placeholder="全部">
                    </div>
                    
                    <div class="control-group">
                        <label for="frameSkip">跳帧间隔</label>
                        <input type="number" id="frameSkip" min="1" max="10" value="1">
                        <div class="value-display">1 = 不跳帧，2 = 每两帧取一帧</div>
                    </div>
                    
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="invert"> 反转明暗
                        </label>
                    </div>
                    
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="padding"> 添加边框填充
                        </label>
                    </div>
                </div>
                
                <!-- 字符集设置选项卡 -->
                <div class="tab-content" id="tab-charset">
                    <div class="control-group">
                        <label for="charsetType">字符集类型</label>
                        <select id="charsetType">
                            <option value="simple">简单 ( .:-=+*#%@)</option>
                            <option value="detailed" selected>详细 (完整ASCII字符)</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                    
                    <div class="control-group" id="customCharsGroup" style="display: none;">
                        <label for="customChars">自定义字符集</label>
                        <textarea id="customChars" rows="3" placeholder="按明暗顺序输入字符，例如: />.10"></textarea>
                        <div class="value-display">字符按明暗顺序排列，第一个字符表示最暗，最后一个表示最亮</div>
                    </div>
                    
                    <div class="control-group">
                        <label>预设字符集</label>
                        <div style="margin-top: 10px;">
                            <button class="btn btn-secondary" onclick="setCustomChars('/>.10')">数字风格</button>
                            <button class="btn btn-secondary" onclick="setCustomChars('░▒▓█')">方块风格</button>
                            <button class="btn btn-secondary" onclick="setCustomChars('·•●')">圆点风格</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 中间ASCII显示区域 -->
        <div class="ascii-container">
            <pre id="ascii-art">等待生成或加载ASCII动画...</pre>
        </div>
        
        <!-- 右侧渲染参数面板 -->
        <div class="render-panel">
            <h2>🎮 动画播放控制</h2>
            
            <div class="play-controls">
                <button class="btn" id="playBtn">▶️ 播放</button>
                <button class="btn" id="pauseBtn">⏸️ 暂停</button>
                <button class="btn" id="resetBtn">⏹️ 重置</button>
            </div>
            
            <div class="control-group">
                <label for="speedSlider">播放速度 (FPS)</label>
                <input type="range" id="speedSlider" min="1" max="60" value="30">
                <div class="value-display" id="speedValue">30 FPS</div>
            </div>
            
            <h3>🎨 显示效果</h3>
            
            <div class="control-group">
                <label for="fontSizeSlider">字体大小</label>
                <input type="range" id="fontSizeSlider" min="6" max="20" value="10">
                <div class="value-display" id="fontSizeValue">10px</div>
            </div>
            
            <div class="control-group">
                <label for="colorPicker">字符颜色</label>
                <input type="color" id="colorPicker" value="#00FF00">
            </div>
            
            <div class="control-group">
                <label for="bgColorPicker">背景颜色</label>
                <input type="color" id="bgColorPicker" value="#000000">
            </div>
            
            <div class="control-group">
                <label for="fontFamily">字体</label>
                <select id="fontFamily">
                    <option value="'Courier New', Courier, monospace" selected>Courier New</option>
                    <option value="'Monaco', 'Menlo', monospace">Monaco</option>
                    <option value="'Consolas', monospace">Consolas</option>
                    <option value="'Lucida Console', monospace">Lucida Console</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="opacitySlider">透明度</label>
                <input type="range" id="opacitySlider" min="0.1" max="1" step="0.1" value="1">
                <div class="value-display" id="opacityValue">100%</div>
            </div>
            
            <div class="control-group">
                <label for="contrastSlider">显示对比度</label>
                <input type="range" id="contrastSlider" min="0.5" max="2" step="0.1" value="1">
                <div class="value-display" id="contrastValue">100%</div>
            </div>
            
            <div class="status" id="renderStatus">
                准备就绪
            </div>
        </div>
    </div>

    <script>
        // WebSocket连接
        const socket = io();
        
        // 全局变量
        let frames = [];
        let animationInterval = null;
        let currentFrame = 0;
        let isPlaying = false;
        let FRAME_RATE = 30;
        let selectedVideoFile = null;
        
        // DOM元素引用
        const asciiElement = document.getElementById('ascii-art');
        const generationStatus = document.getElementById('generationStatus');
        const renderStatus = document.getElementById('renderStatus');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const progressDetail = document.getElementById('progressDetail');
        const generateBtn = document.getElementById('generateBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            setupTabs();
            loadExistingFrames();
        });
        
        // 设置事件监听器
        function setupEventListeners() {
            // 生成相关
            generateBtn.addEventListener('click', startGeneration);
            cancelBtn.addEventListener('click', cancelGeneration);
            
            // 播放控制
            playBtn.addEventListener('click', startAnimation);
            pauseBtn.addEventListener('click', pauseAnimation);
            resetBtn.addEventListener('click', resetAnimation);
            
            // 参数控制
            setupParameterControls();
            
            // 文件选择
            document.getElementById('videoFile').addEventListener('change', handleFileSelection);
            
            // 字符集类型切换
            document.getElementById('charsetType').addEventListener('change', function() {
                const customGroup = document.getElementById('customCharsGroup');
                if (this.value === 'custom') {
                    customGroup.style.display = 'block';
                } else {
                    customGroup.style.display = 'none';
                }
            });
        }
        
        // 设置选项卡
        function setupTabs() {
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetTab = this.dataset.tab;
                    
                    // 切换按钮状态
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 切换内容显示
                    tabContents.forEach(content => {
                        content.classList.remove('active');
                        if (content.id === `tab-${targetTab}`) {
                            content.classList.add('active');
                        }
                    });
                });
            });
        }
        
        // 设置参数控制
        function setupParameterControls() {
            // 生成参数控件
            const controls = [
                { id: 'frameWidth', display: 'frameWidthValue', suffix: ' 字符' },
                { id: 'brightness', display: 'brightnessValue', suffix: '' },
                { id: 'contrast', display: 'contrastValue', suffix: '' },
                { id: 'gamma', display: 'gammaValue', suffix: '' },
                { id: 'saturation', display: 'saturationValue', suffix: '' },
                { id: 'sharpness', display: 'sharpnessValue', suffix: '' }
            ];
            
            controls.forEach(control => {
                const element = document.getElementById(control.id);
                const display = document.getElementById(control.display);
                
                element.addEventListener('input', function() {
                    display.textContent = this.value + control.suffix;
                });
            });
            
            // 渲染参数控件
            const renderControls = [
                { id: 'speedSlider', display: 'speedValue', suffix: ' FPS', callback: updateSpeed },
                { id: 'fontSizeSlider', display: 'fontSizeValue', suffix: 'px', callback: updateFontSize },
                { id: 'opacitySlider', display: 'opacityValue', suffix: '%', callback: updateOpacity, multiplier: 100 },
                { id: 'contrastSlider', display: 'contrastValue', suffix: '%', callback: updateContrast, multiplier: 100 }
            ];
            
            renderControls.forEach(control => {
                const element = document.getElementById(control.id);
                const display = document.getElementById(control.display);
                
                element.addEventListener('input', function() {
                    const value = control.multiplier ? Math.round(this.value * control.multiplier) : this.value;
                    display.textContent = value + control.suffix;
                    if (control.callback) control.callback();
                });
            });
            
            // 颜色和字体控件
            document.getElementById('colorPicker').addEventListener('input', updateColor);
            document.getElementById('bgColorPicker').addEventListener('input', updateBgColor);
            document.getElementById('fontFamily').addEventListener('change', updateFontFamily);
        }
        
        // 文件选择处理
        function handleFileSelection(event) {
            const file = event.target.files[0];
            if (file) {
                selectedVideoFile = file;
                document.getElementById('selectedFile').textContent = `已选择: ${file.name}`;
            }
        }
        
        // 设置自定义字符集
        function setCustomChars(chars) {
            document.getElementById('charsetType').value = 'custom';
            document.getElementById('customCharsGroup').style.display = 'block';
            document.getElementById('customChars').value = chars;
        }
        
        // 开始生成
        function startGeneration() {
            const params = collectGenerationParams();
            const videoFile = selectedVideoFile ? selectedVideoFile.name : 'bottom-banner.mp4';
            
            fetch('/api/convert', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    video_file: videoFile,
                    params: params
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    updateGenerationStatus('error', data.error);
                } else {
                    updateGenerationStatus('success', data.message);
                }
            })
            .catch(error => {
                updateGenerationStatus('error', '请求失败: ' + error.message);
            });
        }
        
        // 取消生成
        function cancelGeneration() {
            fetch('/api/cancel', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                updateGenerationStatus('info', data.message);
            });
        }
        
        // 收集生成参数
        function collectGenerationParams() {
            return {
                frame_width: parseInt(document.getElementById('frameWidth').value),
                frame_height: document.getElementById('frameHeight').value || null,
                brightness: parseFloat(document.getElementById('brightness').value),
                contrast: parseFloat(document.getElementById('contrast').value),
                gamma: parseFloat(document.getElementById('gamma').value),
                saturation: parseFloat(document.getElementById('saturation').value),
                sharpness: parseFloat(document.getElementById('sharpness').value),
                start_time: parseFloat(document.getElementById('startTime').value) || 0,
                duration: parseFloat(document.getElementById('duration').value) || null,
                frame_skip: parseInt(document.getElementById('frameSkip').value),
                charset: document.getElementById('charsetType').value,
                custom_chars: document.getElementById('customChars').value,
                invert: document.getElementById('invert').checked,
                padding: document.getElementById('padding').checked
            };
        }
        
        // 更新生成状态
        function updateGenerationStatus(type, message) {
            generationStatus.className = `status ${type}`;
            generationStatus.textContent = message;
        }
        
        // 更新进度
        function updateProgress(data) {
            if (data.status === 'running') {
                progressContainer.style.display = 'block';
                generateBtn.disabled = true;
                cancelBtn.disabled = false;
                
                progressFill.style.width = `${data.progress}%`;
                progressText.textContent = data.message;
                progressDetail.textContent = `${data.current_frame}/${data.total_frames} 帧`;
                
                updateGenerationStatus('info', `生成中... ${data.progress.toFixed(1)}%`);
            } else if (data.status === 'completed') {
                progressContainer.style.display = 'none';
                generateBtn.disabled = false;
                cancelBtn.disabled = true;
                
                updateGenerationStatus('success', data.message);
                
                // 生成完成后自动加载新帧
                setTimeout(loadExistingFrames, 1000);
            } else if (data.status === 'error') {
                progressContainer.style.display = 'none';
                generateBtn.disabled = false;
                cancelBtn.disabled = true;
                
                updateGenerationStatus('error', data.message);
            } else {
                progressContainer.style.display = 'none';
                generateBtn.disabled = false;
                cancelBtn.disabled = true;
            }
        }
        
        // WebSocket事件处理
        socket.on('conversion_update', function(data) {
            updateProgress(data);
        });
        
        socket.on('connect', function() {
            console.log('WebSocket连接已建立');
        });
        
        socket.on('disconnect', function() {
            console.log('WebSocket连接已断开');
        });
        
        // 加载现有帧
        async function loadExistingFrames() {
            renderStatus.textContent = "正在检测帧数量...";
            frames = [];
            
            let frameIndex = 0;
            const maxAttempts = 10000;
            
            while (frameIndex < maxAttempts) {
                const frameId = frameIndex.toString().padStart(5, '0');
                const frameUrl = `/ascii_frames/frame_${frameId}.txt`;
                
                try {
                    const response = await fetch(frameUrl);
                    if (response.ok) {
                        const frameContent = await response.text();
                        
                        if (isValidAsciiFrame(frameContent)) {
                            frames.push(frameContent);
                            frameIndex++;
                            
                            if (frameIndex % 10 === 0) {
                                renderStatus.textContent = `正在加载... 已发现 ${frameIndex} 帧`;
                            }
                        } else {
                            break;
                        }
                    } else {
                        break;
                    }
                } catch (error) {
                    break;
                }
            }
            
            if (frames.length > 0) {
                renderStatus.textContent = `加载完成！共 ${frames.length} 帧`;
                asciiElement.textContent = frames[0];
                setupRenderControls();
            } else {
                renderStatus.textContent = "未发现帧文件，请先生成";
                asciiElement.textContent = "等待生成或加载ASCII动画...";
            }
        }
        
        // 验证ASCII帧
        function isValidAsciiFrame(content) {
            if (!content || content.length < 10) return false;
            if (content.includes('<html') || content.includes('<!DOCTYPE')) return false;
            if (content.includes('404') || content.includes('Not Found')) return false;
            
            const validChars = /^[\x20-\x7E\n\r]*$/;
            if (!validChars.test(content)) return false;
            
            const nonWhitespaceCount = content.replace(/\s/g, '').length;
            return nonWhitespaceCount >= 5;
        }
        
        // 设置渲染控件
        function setupRenderControls() {
            // 控件已经在setupParameterControls中设置
        }
        
        // 动画控制函数
        function startAnimation() {
            if (isPlaying || frames.length === 0) return;
            
            isPlaying = true;
            playBtn.style.background = '#0d0';
            pauseBtn.style.background = '#0F0';
            
            const interval = 1000 / FRAME_RATE;
            animationInterval = setInterval(() => {
                asciiElement.textContent = frames[currentFrame];
                currentFrame = (currentFrame + 1) % frames.length;
            }, interval);
        }
        
        function pauseAnimation() {
            if (!isPlaying) return;
            
            isPlaying = false;
            playBtn.style.background = '#0F0';
            pauseBtn.style.background = '#666';
            
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        }
        
        function resetAnimation() {
            pauseAnimation();
            currentFrame = 0;
            if (frames.length > 0) {
                asciiElement.textContent = frames[0];
            }
            playBtn.style.background = '#0F0';
            pauseBtn.style.background = '#666';
        }
        
        // 渲染参数更新函数
        function updateSpeed() {
            FRAME_RATE = parseInt(document.getElementById('speedSlider').value);
            
            if (isPlaying) {
                pauseAnimation();
                startAnimation();
            }
        }
        
        function updateFontSize() {
            const size = document.getElementById('fontSizeSlider').value + 'px';
            asciiElement.style.fontSize = size;
        }
        
        function updateColor() {
            asciiElement.style.color = document.getElementById('colorPicker').value;
        }
        
        function updateBgColor() {
            document.body.style.backgroundColor = document.getElementById('bgColorPicker').value;
        }
        
        function updateFontFamily() {
            asciiElement.style.fontFamily = document.getElementById('fontFamily').value;
        }
        
        function updateOpacity() {
            const opacity = parseFloat(document.getElementById('opacitySlider').value);
            asciiElement.style.opacity = opacity;
        }
        
        function updateContrast() {
            const contrast = parseFloat(document.getElementById('contrastSlider').value);
            asciiElement.style.filter = `contrast(${contrast})`;
        }
    </script>
</body>
