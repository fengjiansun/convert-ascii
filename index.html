<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Generator & Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #0a0a0a;
            color: #0F0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        
        .main-container {
            display: flex;
            height: 100vh;
        }
        
        /* 左侧生成参数面板 */
        .generation-panel {
            width: 350px;
            background: rgba(15, 15, 15, 0.95);
            border-right: 2px solid #0F0;
            overflow-y: auto;
            padding: 20px;
        }
        
        /* 中间ASCII显示区域 */
        .ascii-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }
        
        /* 视频视图容器 */
        .video-views-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }
        
        /* 单个视频视图 */
        .video-view {
            flex: 1 1 calc(50% - 10px);
            min-width: 300px;
            max-width: calc(50% - 10px);
            border: 2px solid #0F0;
            border-radius: 8px;
            padding: 10px;
            background: #000;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .video-view.selected {
            border-color: #44ff44;
            background: rgba(68, 255, 68, 0.05);
        }
        
        .video-view.generating {
            border-color: #ffaa00;
            background: rgba(255, 170, 0, 0.05);
        }
        
        /* 视频视图头部 */
        .video-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #0F0;
        }
        
        .video-view-title {
            color: #0F0;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .video-view-controls {
            display: flex;
            gap: 5px;
        }
        
        .video-view-controls .btn {
            padding: 4px 8px;
            font-size: 12px;
            margin-bottom: 0;
        }
        
        /* 视频视图内容 */
        .video-view-content {
            height: calc(100% - 40px);
            overflow: hidden;
        }
        
        .video-view-ascii {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8px;
            line-height: 1.0;
            white-space: pre;
            text-align: center;
            transition: all 0.3s ease;
            height: 100%;
            overflow: auto;
        }
        
        /* 视频视图进度 */
        .video-view-progress {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            display: none;
        }
        
        .video-view-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0F0, #0d0);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .video-view-progress-text {
            position: absolute;
            bottom: 25px;
            left: 10px;
            right: 10px;
            color: #0F0;
            font-size: 12px;
            text-align: center;
            display: none;
        }
        
        /* 右侧渲染参数面板 */
        .render-panel {
            width: 280px;
            background: rgba(20, 20, 20, 0.95);
            border-left: 2px solid #0F0;
            overflow-y: auto;
            padding: 20px;
        }
        
        #ascii-art {
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            line-height: 1.0;
            white-space: pre;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        /* 控制组样式 */
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #0F0;
            font-size: 14px;
            font-weight: bold;
        }
        
        .control-group input, .control-group select, .control-group textarea {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #0F0;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        
        .control-group input[type="range"] {
            height: 6px;
            background: #333;
            outline: none;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: #0F0;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .control-group input[type="color"] {
            height: 40px;
            border: none;
            cursor: pointer;
        }
        
        .control-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        
        .value-display {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        /* 按钮样式 */
        .btn {
            padding: 12px;
            background: #0F0;
            border: none;
            border-radius: 4px;
            color: #000;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #0d0;
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #666;
            color: #fff;
        }
        
        .btn-secondary:hover {
            background: #777;
        }
        
        .btn-danger {
            background: #ff4444;
            color: #fff;
        }
        
        .btn-danger:hover {
            background: #ff6666;
        }
        
        /* 进度条样式 */
        .progress-container {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #0F0;
            border-radius: 4px;
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0F0, #0d0);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        /* 视频视图样式 */
        .video-view {
            border: 1px solid #0F0;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .video-view.selected {
            border-color: #FF0;
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        }
        
        .video-view.generating {
            border-color: #00F;
            box-shadow: 0 0 10px rgba(0, 0, 255, 0.5);
        }
        
        .video-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .video-view-title {
            font-size: 14px;
            font-weight: bold;
            color: #0F0;
        }
        
        .video-view-controls {
            display: flex;
            gap: 5px;
        }
        
        .video-view-controls .btn {
            padding: 5px 10px;
            font-size: 12px;
            margin-bottom: 0;
        }
        
        .video-view-content {
            height: 300px;
            overflow-y: auto;
            background: #000;
            border: 1px solid #0F0;
            border-radius: 4px;
            position: relative;
        }
        
        .video-view-ascii {
            font-family: 'Courier New', monospace;
            font-size: 8px;
            line-height: 1.0;
            color: #0F0;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            padding: 10px;
        }
        
        .video-view-progress {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
            display: none;
        }
        
        .video-view-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0F0, #0d0);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .video-view-progress-text {
            font-size: 12px;
            color: #0F0;
            text-align: center;
            margin: 0;
        }
        
        /* 批量控制按钮样式 */
        .batch-controls {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .batch-controls .btn {
            padding: 5px 10px;
            font-size: 12px;
            margin-bottom: 0;
        }
        
        /* 帧容器样式 */
        .frames-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        .frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            line-height: 1.0;
            color: #0F0;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            padding: 10px;
            overflow-y: auto;
        }
        
        /* 加载覆盖层样式 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .loading-content {
            text-align: center;
            color: #0F0;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #0F0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
            border-radius: 10px;
        }
        
        .progress-text {
            color: #0F0;
            font-size: 12px;
            text-align: center;
        }
        
        /* 状态显示 */
        .status {
            padding: 10px;
            background: rgba(15, 255, 15, 0.1);
            border: 1px solid #0F0;
            border-radius: 4px;
            color: #0F0;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .status.error {
            background: rgba(255, 68, 68, 0.1);
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .status.success {
            background: rgba(68, 255, 68, 0.1);
            border-color: #44ff44;
            color: #44ff44;
        }
        
        /* 标题样式 */
        h2 {
            color: #0F0;
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 2px solid #0F0;
            padding-bottom: 10px;
        }
        
        h3 {
            color: #0F0;
            margin: 20px 0 15px 0;
            font-size: 16px;
        }
        
        /* 文件选择区域 */
        .file-selection {
            border: 2px dashed #0F0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .file-selection:hover {
            background: rgba(15, 255, 15, 0.05);
        }
        
        .file-selection input[type="file"] {
            display: none;
        }
        
        .file-selection label {
            cursor: pointer;
            color: #0F0;
            font-size: 14px;
        }
        
        /* 渲染控制样式 */
        .play-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .play-controls .btn {
            flex: 1;
            margin-bottom: 0;
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #222;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #0F0;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #0d0;
        }
        
        /* 选项卡切换 */
        .tab-container {
            margin-bottom: 20px;
        }
        
        .tab-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        
        .tab-btn {
            padding: 8px 16px;
            background: #333;
            border: 1px solid #555;
            color: #ccc;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            font-size: 12px;
        }
        
        .tab-btn.active {
            background: #0F0;
            color: #000;
            border-color: #0F0;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 加载进度覆盖层 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-content {
            text-align: center;
            color: #0F0;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top: 3px solid #0F0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .loading-progress {
            font-size: 24px;
            font-weight: bold;
            color: #0d0;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 左侧生成参数面板 -->
        <div class="generation-panel">
            <h2>🎬 ASCII 帧生成器</h2>
            
            <!-- 用户ID显示 -->
            <div class="control-group">
                <label>当前用户ID</label>
                <div class="status" id="userIdDisplay">
                    正在生成用户ID...
                </div>
                <div class="value-display">此ID用于隔离不同用户的文件</div>
            </div>
            
            <!-- 文件选择 -->
            <div class="control-group">
                <label>选择视频文件</label>
                <div class="file-selection" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                    <input type="file" id="videoFile" accept="video/*" multiple>
                    <label for="videoFile">
                        📁 点击选择视频文件<br>
                        <small>或拖拽文件到此处</small><br>
                        <small style="color: #999;">支持: MP4, AVI, MOV, MKV, WMV, FLV, WEBM (最大100MB)</small><br>
                        <small style="color: #666;">留空使用默认的 bottom-banner.mp4</small>
                    </label>
                    <div id="selectedFiles" class="value-display"></div>
                    <button type="button" id="clearFileBtn" class="btn btn-secondary" style="display: none; margin-top: 10px;">🗑️ 清除选择</button>
                </div>
            </div>
            
            <!-- 生成状态 -->
            <div class="status" id="generationStatus">
                等待开始生成...
            </div>
            
            <!-- 进度条 -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-text" id="progressText">准备中...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="value-display" id="progressDetail">0/0 帧</div>
            </div>
            
            <!-- 生成控制按钮 -->
            <button class="btn" id="generateBtn">🚀 开始生成</button>
            <button class="btn btn-danger" id="cancelBtn" disabled>❌ 取消生成</button>
            <button class="btn btn-secondary" id="clearBtn">🗑️ 清空帧文件</button>
            
            <!-- 选项卡容器 -->
            <div class="tab-container">
                <div class="tab-buttons">
                    <div class="tab-btn active" data-tab="basic">基础设置</div>
                    <div class="tab-btn" data-tab="advanced">高级设置</div>
                    <div class="tab-btn" data-tab="charset">字符集</div>
                </div>
                
                <!-- 基础设置选项卡 -->
                <div class="tab-content active" id="tab-basic">
                    <div class="control-group">
                        <label for="frameWidth">输出宽度 (字符数)</label>
                        <input type="range" id="frameWidth" min="20" max="200" value="100">
                        <div class="value-display" id="frameWidthValue">100 字符</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="frameHeight">输出高度 (留空自动计算)</label>
                        <input type="number" id="frameHeight" placeholder="自动计算">
                        <div class="value-display">留空将按比例自动计算高度</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="brightness">亮度调整</label>
                        <input type="range" id="brightness" min="0.1" max="3.0" step="0.1" value="1.0">
                        <div class="value-display" id="brightnessValue">1.0</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="contrast">对比度调整</label>
                        <input type="range" id="contrast" min="0.1" max="3.0" step="0.1" value="1.0">
                        <div class="value-display" id="contrastValue">1.0</div>
                    </div>
                </div>
                
                <!-- 高级设置选项卡 -->
                <div class="tab-content" id="tab-advanced">
                    <div class="control-group">
                        <label for="gamma">伽马值</label>
                        <input type="range" id="gamma" min="0.1" max="3.0" step="0.1" value="1.0">
                        <div class="value-display" id="gammaValue">1.0</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="saturation">饱和度</label>
                        <input type="range" id="saturation" min="0.0" max="2.0" step="0.1" value="1.0">
                        <div class="value-display" id="saturationValue">1.0</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="sharpness">锐度</label>
                        <input type="range" id="sharpness" min="0.0" max="2.0" step="0.1" value="1.0">
                        <div class="value-display" id="sharpnessValue">1.0</div>
                    </div>
                    
                    <div class="control-group">
                        <label for="startTime">开始时间 (秒)</label>
                        <input type="number" id="startTime" min="0" step="0.1" value="0">
                    </div>
                    
                    <div class="control-group">
                        <label for="duration">处理时长 (秒，留空处理全部)</label>
                        <input type="number" id="duration" min="0.1" step="0.1" placeholder="全部">
                    </div>
                    
                    <div class="control-group">
                        <label for="frameSkip">跳帧间隔</label>
                        <input type="number" id="frameSkip" min="1" max="10" value="1">
                        <div class="value-display">1 = 不跳帧，2 = 每两帧取一帧</div>
                    </div>
                    
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="invert"> 反转明暗
                        </label>
                    </div>
                    
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="padding"> 添加边框填充
                        </label>
                    </div>
                    
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="mirrorFrames"> 生成镜像帧（往返动画）
                        </label>
                        <div class="value-display">将生成的帧序列反向复制，创建往返播放效果，帧数翻倍</div>
                    </div>
                </div>
                
                <!-- 字符集设置选项卡 -->
                <div class="tab-content" id="tab-charset">
                    <div class="control-group">
                        <label for="charsetType">字符集类型</label>
                        <select id="charsetType">
                            <option value="simple">简单 ( .:-=+*#%@)</option>
                            <option value="detailed" selected>详细 (完整ASCII字符)</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                    
                    <div class="control-group" id="customCharsGroup" style="display: none;">
                        <label for="customChars">自定义字符集</label>
                        <textarea id="customChars" rows="3" placeholder="按明暗顺序输入字符，例如: />.10"></textarea>
                        <div class="value-display">字符按明暗顺序排列，第一个字符表示最暗，最后一个表示最亮</div>
                    </div>
                    
                    <div class="control-group">
                        <label>预设字符集</label>
                        <div style="margin-top: 10px;">
                            <button class="btn btn-secondary" onclick="setCustomChars('/>.10')">数字风格</button>
                            <button class="btn btn-secondary" onclick="setCustomChars('░▒▓█')">方块风格</button>
                            <button class="btn btn-secondary" onclick="setCustomChars('·•●')">圆点风格</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 中间ASCII显示区域 -->
        <div class="ascii-container">
            <div id="videoViewsContainer" class="video-views-container"></div>
            <!-- 加载进度显示 -->
            <div class="loading-overlay" id="loadingOverlay" style="display: none;">
                <div class="loading-content">
                    <div class="loading-spinner"></div>
                    <div class="loading-text" id="loadingText">正在加载帧文件...</div>
                    <div class="loading-progress" id="loadingProgress">0%</div>
                </div>
            </div>
        </div>
        
        <!-- 右侧渲染参数面板 -->
        <div class="render-panel">
            <h2>🎮 动画播放控制</h2>
            
            <div class="play-controls">
                <button class="btn" id="playBtn" disabled>▶播放</button>
                <button class="btn" id="pauseBtn" disabled>⏸暂停</button>
                <button class="btn" id="resetBtn" disabled>⏹重置</button>
            </div>
            
            <h3>📋 批量操作</h3>
            
            <div class="batch-controls">
                <button class="btn" id="selectAllBtn">全选</button>
                <button class="btn" id="deselectAllBtn">取消全选</button>
            </div>
            
            <div class="batch-controls">
                <button class="btn" id="playSelectedBtn" disabled>播放选中</button>
                <button class="btn" id="pauseSelectedBtn" disabled>暂停选中</button>
                <button class="btn" id="resetSelectedBtn" disabled>重置选中</button>
            </div>
            
            <div class="control-group">
                <label for="speedSlider">播放速度 (FPS)</label>
                <input type="range" id="speedSlider" min="1" max="60" value="30">
                <div class="value-display" id="speedValue">30 FPS</div>
            </div>
            
            <h3>🎨 显示效果</h3>
            
            <div class="control-group">
                <label for="fontSizeSlider">字体大小</label>
                <input type="range" id="fontSizeSlider" min="6" max="20" value="10">
                <div class="value-display" id="fontSizeValue">10px</div>
            </div>
            
            <div class="control-group">
                <label for="colorPicker">字符颜色</label>
                <input type="color" id="colorPicker" value="#00FF00">
            </div>
            
            <div class="control-group">
                <label for="bgColorPicker">背景颜色</label>
                <input type="color" id="bgColorPicker" value="#000000">
            </div>
            
            <div class="control-group">
                <label for="fontFamily">字体</label>
                <select id="fontFamily">
                    <option value="'Courier New', Courier, monospace" selected>Courier New</option>
                    <option value="'Monaco', 'Menlo', monospace">Monaco</option>
                    <option value="'Consolas', monospace">Consolas</option>
                    <option value="'Lucida Console', monospace">Lucida Console</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="opacitySlider">透明度</label>
                <input type="range" id="opacitySlider" min="0.1" max="1" step="0.1" value="1">
                <div class="value-display" id="opacityValue">100%</div>
            </div>
            
            <div class="control-group">
                <label for="contrastSlider">显示对比度</label>
                <input type="range" id="contrastSlider" min="0.5" max="2" step="0.1" value="1">
                <div class="value-display" id="contrastValue">100%</div>
            </div>
            
            <div class="status" id="renderStatus">
                准备就绪
            </div>
        </div>
    </div>

    <script>
        // WebSocket连接（延迟初始化）
        let socket = null;
        
        // 全局变量
        let frames = [];
        let animationInterval = null;
        let currentFrame = 0;
        let isPlaying = false;
        let FRAME_RATE = 30;
        let selectedVideoFiles = [];
        let userId = null;
        
        // 视频播放器对象，用于管理每个视频的播放状态
        const videoPlayers = {};
        const videoViews = {};
        
        // DOM元素引用
        const asciiElement = document.getElementById('ascii-art');
        const generationStatus = document.getElementById('generationStatus');
        const renderStatus = document.getElementById('renderStatus');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        
        // 批量操作按钮引用
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        const playSelectedBtn = document.getElementById('playSelectedBtn');
        const pauseSelectedBtn = document.getElementById('pauseSelectedBtn');
        const resetSelectedBtn = document.getElementById('resetSelectedBtn');
        const progressDetail = document.getElementById('progressDetail');
        const generateBtn = document.getElementById('generateBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const clearBtn = document.getElementById('clearBtn');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const loadingProgress = document.getElementById('loadingProgress');
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeUserId();
            setupEventListeners();
            setupTabs();
            loadExistingFrames();
        });
        
        // 初始化用户ID
        function initializeUserId() {
            // 尝试从LocalStorage获取现有ID
            userId = localStorage.getItem('ascii_generator_user_id');
            
            if (!userId) {
                // 如果没有ID，生成一个新的
                userId = generateRandomId();
                localStorage.setItem('ascii_generator_user_id', userId);
            }
            
            // 显示用户ID
            const userIdDisplay = document.getElementById('userIdDisplay');
            userIdDisplay.textContent = userId;
            userIdDisplay.className = 'status success';
            
            // 用户ID设置完成后初始化WebSocket连接
            initializeWebSocket();
        }
        
        // 初始化WebSocket连接
        function initializeWebSocket() {
            socket = io();
            
            // WebSocket事件处理
            socket.on('conversion_update', function(data) {
                updateProgress(data);
            });
            
            socket.on('connect', function() {
                console.log('WebSocket连接已建立');
                // 加入用户专属房间
                if (userId) {
                    socket.emit('join_user_room', { user_id: userId });
                }
            });
            
            socket.on('disconnect', function() {
                console.log('WebSocket连接已断开');
            });
        }
        
        // 生成随机ID
        function generateRandomId() {
            return 'user_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 生成相关
            generateBtn.addEventListener('click', startGeneration);
            cancelBtn.addEventListener('click', cancelGeneration);
            clearBtn.addEventListener('click', clearFrames);
            
            // 播放控制
            playBtn.addEventListener('click', startAnimation);
            pauseBtn.addEventListener('click', pauseAnimation);
            resetBtn.addEventListener('click', resetAnimation);
            
            // 参数控制
            setupParameterControls();
            
            // 文件选择
            document.getElementById('videoFile').addEventListener('change', handleFileSelection);
            document.getElementById('clearFileBtn').addEventListener('click', clearFileSelection);
            
            // 字符集类型切换
            document.getElementById('charsetType').addEventListener('change', function() {
                const customGroup = document.getElementById('customCharsGroup');
                if (this.value === 'custom') {
                    customGroup.style.display = 'block';
                } else {
                    customGroup.style.display = 'none';
                }
            });
        }
        
        // 设置选项卡
        function setupTabs() {
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const targetTab = this.dataset.tab;
                    
                    // 切换按钮状态
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 切换内容显示
                    tabContents.forEach(content => {
                        content.classList.remove('active');
                        if (content.id === `tab-${targetTab}`) {
                            content.classList.add('active');
                        }
                    });
                });
            });
        }
        
        // 设置参数控制
        function setupParameterControls() {
            // 生成参数控件
            const controls = [
                { id: 'frameWidth', display: 'frameWidthValue', suffix: ' 字符' },
                { id: 'brightness', display: 'brightnessValue', suffix: '' },
                { id: 'contrast', display: 'contrastValue', suffix: '' },
                { id: 'gamma', display: 'gammaValue', suffix: '' },
                { id: 'saturation', display: 'saturationValue', suffix: '' },
                { id: 'sharpness', display: 'sharpnessValue', suffix: '' }
            ];
            
            controls.forEach(control => {
                const element = document.getElementById(control.id);
                const display = document.getElementById(control.display);
                
                element.addEventListener('input', function() {
                    display.textContent = this.value + control.suffix;
                });
            });
            
            // 渲染参数控件
            const renderControls = [
                { id: 'speedSlider', display: 'speedValue', suffix: ' FPS', callback: updateSpeed },
                { id: 'fontSizeSlider', display: 'fontSizeValue', suffix: 'px', callback: updateFontSize },
                { id: 'opacitySlider', display: 'opacityValue', suffix: '%', callback: updateOpacity, multiplier: 100 },
                { id: 'contrastSlider', display: 'contrastValue', suffix: '%', callback: updateContrast, multiplier: 100 }
            ];
            
            renderControls.forEach(control => {
                const element = document.getElementById(control.id);
                const display = document.getElementById(control.display);
                
                element.addEventListener('input', function() {
                    const value = control.multiplier ? Math.round(this.value * control.multiplier) : this.value;
                    display.textContent = value + control.suffix;
                    if (control.callback) control.callback();
                });
            });
            
            // 颜色和字体控件
            document.getElementById('colorPicker').addEventListener('input', updateColor);
            document.getElementById('bgColorPicker').addEventListener('input', updateBgColor);
            document.getElementById('fontFamily').addEventListener('change', updateFontFamily);
        }
        
        // 拖拽上传处理
        function handleDragOver(event) {
            event.preventDefault();
            event.stopPropagation();
            const fileSelection = document.querySelector('.file-selection');
            fileSelection.style.borderColor = '#44ff44';
            fileSelection.style.background = 'rgba(68, 255, 68, 0.1)';
        }
        
        function handleDragLeave(event) {
            event.preventDefault();
            event.stopPropagation();
            const fileSelection = document.querySelector('.file-selection');
            fileSelection.style.borderColor = '#0F0';
            fileSelection.style.background = 'transparent';
        }
        
        function handleDrop(event) {
            event.preventDefault();
            event.stopPropagation();
            const fileSelection = document.querySelector('.file-selection');
            fileSelection.style.borderColor = '#0F0';
            fileSelection.style.background = 'transparent';
            
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                const fileInput = document.getElementById('videoFile');
                fileInput.files = files;
                handleFileSelection({ target: { files: files } });
            }
        }

        // 文件选择处理
        function handleFileSelection(event) {
            const files = Array.from(event.target.files);
            const selectedFilesDiv = document.getElementById('selectedFiles');
            const fileSelection = document.querySelector('.file-selection');
            
            if (files.length > 0) {
                // 检查所有文件
                const validFiles = [];
                const invalidFiles = [];
                
                files.forEach(file => {
                    // 检查文件类型
                    const allowedTypes = ['video/mp4', 'video/avi', 'video/mov', 'video/mkv', 'video/wmv', 'video/flv', 'video/webm', 'video/x-msvideo'];
                    const fileExtension = file.name.split('.').pop().toLowerCase();
                    const allowedExtensions = ['mp4', 'avi', 'mov', 'mkv', 'wmv', 'flv', 'webm', 'm4v'];
                    
                    // 检查文件大小 (100MB)
                    const maxSize = 100 * 1024 * 1024;
                    
                    if (!allowedTypes.includes(file.type) && !allowedExtensions.includes(fileExtension)) {
                        invalidFiles.push(`❌ 不支持的文件格式: ${file.name}`);
                    } else if (file.size > maxSize) {
                        invalidFiles.push(`❌ 文件太大: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)}MB)`);
                    } else {
                        validFiles.push(file);
                    }
                });
                
                // 更新选择的文件
                selectedVideoFiles = validFiles;
                
                // 显示结果
                let displayHtml = '';
                
                if (validFiles.length > 0) {
                    displayHtml += `<span style="color: #44ff44;">✅ 已选择 ${validFiles.length} 个视频文件</span><br>`;
                    validFiles.forEach(file => {
                        const fileSizeMB = (file.size / 1024 / 1024).toFixed(1);
                        displayHtml += `<small>${file.name} (${fileSizeMB}MB | ${file.type || '未知'})</small><br>`;
                    });
                    fileSelection.style.borderColor = '#44ff44';
                    fileSelection.style.background = 'rgba(68, 255, 68, 0.05)';
                } else {
                    fileSelection.style.borderColor = '#ff4444';
                    fileSelection.style.background = 'rgba(255, 68, 68, 0.05)';
                }
                
                if (invalidFiles.length > 0) {
                    displayHtml += `<br><span style="color: #ff4444;">以下文件不符合要求:</span><br>`;
                    invalidFiles.forEach(msg => {
                        displayHtml += `<small>${msg}</small><br>`;
                    });
                }
                
                selectedFilesDiv.innerHTML = displayHtml;
                
                // 显示清除按钮
                document.getElementById('clearFileBtn').style.display = 'block';
                
                // 创建视频视图
                createVideoViews(validFiles);
            } else {
                clearFileSelection();
            }
        }
        
        // 清除文件选择
        function clearFileSelection() {
            selectedVideoFiles = [];
            document.getElementById('selectedFiles').textContent = '';
            document.getElementById('videoFile').value = '';
            document.getElementById('clearFileBtn').style.display = 'none';
            
            const fileSelection = document.querySelector('.file-selection');
            fileSelection.style.borderColor = '#0F0';
            fileSelection.style.background = 'transparent';
            
            // 清除所有视频视图
            clearVideoViews();
        }
        
        // 创建视频视图
        function createVideoViews(files) {
            const container = document.getElementById('videoViewsContainer');
            container.innerHTML = '';
            
            files.forEach((file, index) => {
                const viewId = `video-view-${index}`;
                const progressId = `video-progress-${index}`;
                const progressFillId = `video-progress-fill-${index}`;
                const progressTextId = `video-progress-text-${index}`;
                
                const viewHTML = `
                    <div id="${viewId}" class="video-view" data-file-index="${index}">
                        <div class="loading-overlay" id="loading-overlay-${index}" style="display: none;">
                            <div class="loading-content">
                                <div class="loading-spinner"></div>
                                <p>正在加载帧...</p>
                            </div>
                        </div>
                        <div class="video-view-header">
                            <div class="video-view-title">${file.name}</div>
                            <div class="video-view-controls">
                            <button id="play-btn-${index}" class="btn btn-success view-play-btn" data-view-id="${index}" disabled>播放</button>
                            <button id="pause-btn-${index}" class="btn btn-warning view-pause-btn" data-view-id="${index}" disabled>暂停</button>
                            <button id="reset-btn-${index}" class="btn btn-info view-reset-btn" data-view-id="${index}" disabled>重置</button>
                        </div>
                        </div>
                        <div class="video-view-content">
                            <div id="frames-container-${index}" class="frames-container">
                                <pre class="video-view-ascii">等待生成ASCII动画...</pre>
                            </div>
                        </div>
                        <div id="${progressId}" class="video-view-progress">
                            <div id="${progressFillId}" class="video-view-progress-fill"></div>
                        </div>
                        <div id="${progressTextId}" class="video-view-progress-text">生成进度：0%</div>
                    </div>
                `;
                
                container.innerHTML += viewHTML;
                
                // 添加视图点击事件（选中/取消选中）
                const viewElement = document.getElementById(viewId);
                viewElement.addEventListener('click', () => toggleViewSelection(index));
                
                // 添加视图控制按钮事件
                document.querySelector(`.view-play-btn[data-view-id="${index}"]`).addEventListener('click', (e) => {
                    e.stopPropagation(); // 防止触发视图选中
                    playVideo(index);
                });
                
                document.querySelector(`.view-pause-btn[data-view-id="${index}"]`).addEventListener('click', (e) => {
                    e.stopPropagation(); // 防止触发视图选中
                    pauseVideo(index);
                });
                
                document.querySelector(`.view-reset-btn[data-view-id="${index}"]`).addEventListener('click', (e) => {
                    e.stopPropagation(); // 防止触发视图选中
                    resetVideo(index);
                });
                
                // 初始化视频播放器状态
                videoPlayers[index] = {
                    currentFrame: 0,
                    isPlaying: false,
                    animationId: null,
                    frames: [],
                    speed: 30
                };
                
                // 初始化视频视图状态 - 上传后默认正在生成，防止用户点击选择
                 videoViews[index] = {
                     isSelected: false,
                     isGenerating: true,
                     generationProgress: 0,
                     font: 'Courier New',
                     fontSize: 8,
                     lineHeight: 1.0,
                     opacity: 1.0,
                     contrast: 1.0,
                     brightness: 1.0,
                     invert: false
                 };
            });
            
            // 禁用批量操作按钮，直到生成完成
            selectAllBtn.disabled = true;
            deselectAllBtn.disabled = true;
            playSelectedBtn.disabled = true;
            pauseSelectedBtn.disabled = true;
            resetSelectedBtn.disabled = true;
        }
        
        // 清除所有视频视图
        function clearVideoViews() {
            const container = document.getElementById('videoViewsContainer');
            container.innerHTML = '';
            videoPlayers = {};
            videoViews = {};
            
            // 禁用批量操作按钮
            selectAllBtn.disabled = true;
            deselectAllBtn.disabled = true;
            playSelectedBtn.disabled = true;
            pauseSelectedBtn.disabled = true;
            resetSelectedBtn.disabled = true;
        }
        
        // 切换视图选中状态
        function toggleViewSelection(index) {
            const viewElement = document.getElementById(`video-view-${index}`);
            const viewState = videoViews[index];
            
            // 调试信息
            console.log(`toggleViewSelection called for index ${index}`);
            console.log(`viewState.isGenerating: ${viewState.isGenerating}`);
            console.log(`viewState.isSelected: ${viewState.isSelected}`);
            
            if (!viewState.isGenerating) {
                viewState.isSelected = !viewState.isSelected;
                
                if (viewState.isSelected) {
                    viewElement.classList.add('selected');
                } else {
                    viewElement.classList.remove('selected');
                }
                
                // 调试信息
                console.log(`viewState.isSelected after toggle: ${viewState.isSelected}`);
            } else {
                console.log(`View is generating, cannot select`);
            }
        }
        
        // 播放视频
        function playVideo(index) {
            const viewState = videoViews[index];
            const player = videoPlayers[index];
            
            if (!viewState.isGenerating && player && player.frames.length > 0 && !player.isPlaying) {
                player.isPlaying = true;
                startAnimationForPlayer(index);
            }
        }
        
        // 暂停视频
        function pauseVideo(index) {
            const viewState = videoViews[index];
            const player = videoPlayers[index];
            
            if (!viewState.isGenerating && player && player.isPlaying) {
                player.isPlaying = false;
                if (player.animationId) {
                    cancelAnimationFrame(player.animationId);
                    player.animationId = null;
                }
            }
        }
        
        // 重置视频
        function resetVideo(index) {
            const viewState = videoViews[index];
            const player = videoPlayers[index];
            
            if (!viewState.isGenerating && player) {
                player.isPlaying = false;
                if (player.animationId) {
                    cancelAnimationFrame(player.animationId);
                    player.animationId = null;
                }
                player.currentFrame = 0;
                if (player.frames.length > 0) {
                    updateAsciiDisplayForPlayer(index);
                }
            }
        }
        
        // 批量播放
        function playSelectedVideos() {
            Object.keys(videoViews).forEach(index => {
                const viewState = videoViews[index];
                if (viewState.isSelected && !viewState.isGenerating) {
                    playVideo(parseInt(index));
                }
            });
        }
        
        // 批量暂停
        function pauseSelectedVideos() {
            Object.keys(videoViews).forEach(index => {
                const viewState = videoViews[index];
                if (viewState.isSelected && !viewState.isGenerating) {
                    pauseVideo(parseInt(index));
                }
            });
        }
        
        // 批量重置
        function resetSelectedVideos() {
            Object.keys(videoViews).forEach(index => {
                const viewState = videoViews[index];
                if (viewState.isSelected && !viewState.isGenerating) {
                    resetVideo(parseInt(index));
                }
            });
        }
        
        // 全选
        function selectAllVideos() {
            Object.keys(videoViews).forEach(index => {
                const viewState = videoViews[index];
                const viewElement = document.getElementById(`video-view-${index}`);
                if (!viewState.isGenerating) {
                    viewState.isSelected = true;
                    viewElement.classList.add('selected');
                }
            });
        }
        
        // 取消全选
        function deselectAllVideos() {
            Object.keys(videoViews).forEach(index => {
                const viewState = videoViews[index];
                const viewElement = document.getElementById(`video-view-${index}`);
                viewState.isSelected = false;
                viewElement.classList.remove('selected');
            });
        }
        
        // 为指定播放器开始动画
        function startAnimationForPlayer(index) {
            const player = videoPlayers[index];
            if (!player || !player.isPlaying || player.frames.length === 0) return;
            
            player.currentFrame = (player.currentFrame + 1) % player.frames.length;
            updateAsciiDisplayForPlayer(index);
            
            player.animationId = setTimeout(() => {
                startAnimationForPlayer(index);
            }, 1000 / player.speed);
        }
        
        // 更新指定播放器的ASCII显示
        function updateAsciiDisplayForPlayer(index) {
            const player = videoPlayers[index];
            const viewState = videoViews[index];
            
            if (player && player.frames.length > 0) {
                // 获取frames容器
                const framesContainer = document.getElementById(`frames-container-${index}`);
                
                // 隐藏所有帧
                const allFrames = framesContainer.querySelectorAll('.frame');
                allFrames.forEach(frame => frame.style.display = 'none');
                
                // 显示当前帧
                const currentFrame = allFrames[player.currentFrame];
                if (currentFrame) {
                    currentFrame.style.display = 'block';
                    
                    // 应用视图属性
                    currentFrame.style.fontFamily = viewState.font;
                    currentFrame.style.fontSize = `${viewState.fontSize}px`;
                    currentFrame.style.lineHeight = viewState.lineHeight;
                    currentFrame.style.opacity = viewState.opacity;
                    currentFrame.style.filter = `contrast(${viewState.contrast}) brightness(${viewState.brightness}) ${viewState.invert ? 'invert(1)' : ''}`;
                }
            }
        }
        
        // 设置自定义字符集
        function setCustomChars(chars) {
            document.getElementById('charsetType').value = 'custom';
            document.getElementById('customCharsGroup').style.display = 'block';
            document.getElementById('customChars').value = chars;
        }
        
        // 开始生成
        async function startGeneration() {
            if (selectedVideoFiles.length === 0) {
                updateGenerationStatus('error', '请先选择视频文件');
                return;
            }
            
            const params = collectGenerationParams();
            
            // 创建一个数组来存储所有视频的上传结果
            const uploadPromises = [];
            
            // 标记所有视图为正在生成
            for (let i = 0; i < selectedVideoFiles.length; i++) {
                const viewState = videoViews[i];
                viewState.isGenerating = true;
                const viewElement = document.getElementById(`video-view-${i}`);
                viewElement.classList.add('generating');
                viewElement.classList.remove('selected');
                
                // 禁用播放控制按钮
                const playBtn = document.getElementById(`play-btn-${i}`);
                const pauseBtn = document.getElementById(`pause-btn-${i}`);
                const resetBtn = document.getElementById(`reset-btn-${i}`);
                playBtn.disabled = true;
                pauseBtn.disabled = true;
                resetBtn.disabled = true;
                
                // 显示视图进度
                const progressElement = document.getElementById(`video-progress-${i}`);
                const progressFillElement = document.getElementById(`video-progress-fill-${i}`);
                const progressTextElement = document.getElementById(`video-progress-text-${i}`);
                
                progressElement.style.display = 'block';
                progressTextElement.style.display = 'block';
                progressFillElement.style.width = '0%';
                progressTextElement.textContent = `上传中... 0%`;
            }
            
            // 并行上传所有视频
            for (let i = 0; i < selectedVideoFiles.length; i++) {
                const videoFile = selectedVideoFiles[i];
                const progressFillElement = document.getElementById(`video-progress-fill-${i}`);
                const progressTextElement = document.getElementById(`video-progress-text-${i}`);
                
                // 上传文件
                const uploadPromise = new Promise((resolve, reject) => {
                    const formData = new FormData();
                    formData.append('file', videoFile);
                    formData.append('user_id', userId);
                    formData.append('video_index', i); // 添加视频索引，用于区分不同视频
                    
                    // 使用XMLHttpRequest来显示上传进度
                    const xhr = new XMLHttpRequest();
                    
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const progress = (e.loaded / e.total) * 100;
                            progressFillElement.style.width = `${progress}%`;
                            progressTextElement.textContent = `上传中... ${progress.toFixed(1)}%`;
                        }
                    });
                    
                    xhr.addEventListener('load', () => {
                        if (xhr.status === 200) {
                            try {
                                const uploadData = JSON.parse(xhr.responseText);
                                if (uploadData.error) {
                                    progressTextElement.textContent = `上传失败: ${uploadData.error}`;
                                    progressTextElement.style.color = '#ff4444';
                                    const viewState = videoViews[i];
                                    viewState.isGenerating = false;
                                    const viewElement = document.getElementById(`video-view-${i}`);
                                    viewElement.classList.remove('generating');
                                    reject(new Error(uploadData.error));
                                } else {
                                    progressFillElement.style.width = '100%';
                                    progressTextElement.textContent = '上传完成，等待转换...';
                                    resolve({ index: i, data: uploadData });
                                }
                            } catch (e) {
                                reject(new Error('服务器响应格式错误'));
                            }
                        } else {
                            try {
                                const errorData = JSON.parse(xhr.responseText);
                                reject(new Error(errorData.error || '上传失败'));
                            } catch (e) {
                                reject(new Error(`上传失败: HTTP ${xhr.status}`));
                            }
                        }
                    });
                    
                    xhr.addEventListener('error', () => {
                        reject(new Error('网络错误'));
                    });
                    
                    xhr.open('POST', '/api/upload');
                    xhr.send(formData);
                });
                
                uploadPromises.push(uploadPromise);
            }
            
            try {
                // 等待所有视频上传完成
                const uploadResults = await Promise.all(uploadPromises);
                
                // 准备转换请求数据
                const videos = uploadResults.map(result => ({
                    video_file: result.data.filename,
                    params: params
                }));
                
                // 开始转换
                const convertResponse = await fetch('/api/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        videos: videos
                    })
                });
                
                const convertData = await convertResponse.json();
                
                if (convertData.error) {
                    updateGenerationStatus('error', `转换失败: ${convertData.error}`);
                } else {
                    updateGenerationStatus('info', `已提交 ${selectedVideoFiles.length} 个转换任务`);
                }
                
            } catch (error) {
                updateGenerationStatus('error', `上传失败: ${error.message}`);
            }
            
            updateGenerationStatus('info', `已提交 ${selectedVideoFiles.length} 个转换任务`);
        }
        
        // 取消生成
        function cancelGeneration() {
            fetch('/api/cancel', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    user_id: userId
                })
            })
            .then(response => response.json())
            .then(data => {
                updateGenerationStatus('info', data.message);
            });
        }
        
        // 清空帧文件
        function clearFrames() {
            if (!confirm('确定要清空所有帧文件吗？此操作不可撤销。')) {
                return;
            }
            
            fetch('/api/clear_frames', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    user_id: userId
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    updateGenerationStatus('error', data.error);
                } else {
                    updateGenerationStatus('success', data.message);
                    // 清空后重新加载（应该显示空状态）
                    setTimeout(loadExistingFrames, 500);
                }
            })
            .catch(error => {
                updateGenerationStatus('error', '清空失败: ' + error.message);
            });
        }
        
        // 收集生成参数
        function collectGenerationParams() {
            return {
                frame_width: parseInt(document.getElementById('frameWidth').value),
                frame_height: document.getElementById('frameHeight').value || null,
                brightness: parseFloat(document.getElementById('brightness').value),
                contrast: parseFloat(document.getElementById('contrast').value),
                gamma: parseFloat(document.getElementById('gamma').value),
                saturation: parseFloat(document.getElementById('saturation').value),
                sharpness: parseFloat(document.getElementById('sharpness').value),
                start_time: parseFloat(document.getElementById('startTime').value) || 0,
                duration: parseFloat(document.getElementById('duration').value) || null,
                frame_skip: parseInt(document.getElementById('frameSkip').value),
                charset: document.getElementById('charsetType').value,
                custom_chars: document.getElementById('customChars').value,
                invert: document.getElementById('invert').checked,
                padding: document.getElementById('padding').checked,
                mirror_frames: document.getElementById('mirrorFrames').checked
            };
        }
        
        // 更新生成状态
        function updateGenerationStatus(type, message) {
            generationStatus.className = `status ${type}`;
            generationStatus.textContent = message;
        }
        
        // 更新进度
        function updateProgress(data) {
            // 检查是否是多视频进度更新
            if (data.video_index !== undefined) {
                const videoIndex = data.video_index;
                const viewState = videoViews[videoIndex];
                
                if (!viewState) {
                    console.error(`未找到视频索引为 ${videoIndex} 的视图状态`);
                    return;
                }
                
                // 更新视图进度
                const progressElement = document.getElementById(`video-progress-${videoIndex}`);
                const progressFillElement = document.getElementById(`video-progress-fill-${videoIndex}`);
                const progressTextElement = document.getElementById(`video-progress-text-${videoIndex}`);
                
                if (data.status === 'running') {
                    // 确保进度条显示
                    progressElement.style.display = 'block';
                    progressTextElement.style.display = 'block';
                    
                    // 更新进度
                    progressFillElement.style.width = `${data.progress}%`;
                    progressTextElement.textContent = `${data.message} (${data.progress.toFixed(1)}%)`;
                    
                    // 更新视图状态
                    viewState.generationProgress = data.progress;
                    
                    updateGenerationStatus('info', `视频 ${videoIndex + 1} 生成中... ${data.progress.toFixed(1)}%`);
                } else if (data.status === 'completed') {
                    // 更新进度为100%
                    progressFillElement.style.width = '100%';
                    progressTextElement.textContent = `生成完成`;
                    
                    // 更新视图状态
                    viewState.isGenerating = false;
                    viewState.generationProgress = 100;
                    viewState.frameFolder = data.frame_folder;
                    
                    // 移除生成中样式
                    const viewElement = document.getElementById(`video-view-${videoIndex}`);
                    viewElement.classList.remove('generating');
                    
                    // 启用播放控制按钮
                    const playBtn = document.getElementById(`play-btn-${videoIndex}`);
                    const pauseBtn = document.getElementById(`pause-btn-${videoIndex}`);
                    const resetBtn = document.getElementById(`reset-btn-${videoIndex}`);
                    playBtn.disabled = false;
                    pauseBtn.disabled = false;
                    resetBtn.disabled = false;
                    
                    updateGenerationStatus('success', `视频 ${videoIndex + 1} 生成完成`);
                    
                    // 加载该视频的帧
                    setTimeout(() => loadVideoFrames(videoIndex), 1000);
                } else if (data.status === 'error') {
                    // 更新错误信息
                    progressTextElement.textContent = `生成失败: ${data.message}`;
                    progressTextElement.style.color = '#ff4444';
                    
                    // 更新视图状态
                    viewState.isGenerating = false;
                    
                    // 移除生成中样式
                    const viewElement = document.getElementById(`video-view-${videoIndex}`);
                    viewElement.classList.remove('generating');
                    
                    // 启用播放控制按钮
                    const playBtn = document.getElementById(`play-btn-${videoIndex}`);
                    const pauseBtn = document.getElementById(`pause-btn-${videoIndex}`);
                    const resetBtn = document.getElementById(`reset-btn-${videoIndex}`);
                    playBtn.disabled = false;
                    pauseBtn.disabled = false;
                    resetBtn.disabled = false;
                    
                    updateGenerationStatus('error', `视频 ${videoIndex + 1} 生成失败: ${data.message}`);
                }
            } else {
                // 单视频进度更新（向后兼容）
                if (data.status === 'running') {
                    progressContainer.style.display = 'block';
                    generateBtn.disabled = true;
                    cancelBtn.disabled = false;
                    
                    // 生成开始时禁用播放控制按钮
                    setPlayControlsEnabled(false);
                    
                    progressFill.style.width = `${data.progress}%`;
                    progressText.textContent = data.message;
                    progressDetail.textContent = `${data.current_frame}/${data.total_frames} 帧`;
                    
                    updateGenerationStatus('info', `生成中... ${data.progress.toFixed(1)}%`);
                } else if (data.status === 'completed') {
                    progressContainer.style.display = 'none';
                    generateBtn.disabled = false;
                    cancelBtn.disabled = true;
                    
                    updateGenerationStatus('success', data.message);
                    
                    // 生成完成后自动加载新帧
                    setTimeout(loadExistingFrames, 1000);
                } else if (data.status === 'error') {
                    progressContainer.style.display = 'none';
                    generateBtn.disabled = false;
                    cancelBtn.disabled = true;
                    
                    updateGenerationStatus('error', data.message);
                    
                    // 生成失败时保持播放控制按钮禁用
                    setPlayControlsEnabled(false);
                } else {
                    progressContainer.style.display = 'none';
                    generateBtn.disabled = false;
                    cancelBtn.disabled = true;
                }
            }
        }
        
        // 加载特定视频的ASCII帧
        function loadVideoFrames(videoIndex) {
            const viewState = videoViews[videoIndex];
            if (!viewState) {
                console.error(`未找到视频索引为 ${videoIndex} 的视图状态`);
                return;
            }
            
            // 检查是否已经加载过帧
            if (viewState.frames.length > 0) {
                console.log(`视频 ${videoIndex} 的帧已经加载过了`);
                return;
            }
            
            // 显示加载覆盖层
            const loadingOverlay = document.getElementById(`loading-overlay-${videoIndex}`);
            loadingOverlay.style.display = 'flex';
            
            // 禁用播放控制按钮
            const playBtn = document.getElementById(`play-btn-${videoIndex}`);
            const pauseBtn = document.getElementById(`pause-btn-${videoIndex}`);
            const resetBtn = document.getElementById(`reset-btn-${videoIndex}`);
            playBtn.disabled = true;
            pauseBtn.disabled = true;
            resetBtn.disabled = true;
            
            // 循环检测帧文件是否存在
            let frameCheckInterval = setInterval(() => {
                fetch(`/api/check_frames/${viewState.frameFolder}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'completed') {
                            clearInterval(frameCheckInterval);
                            
                            // 加载所有帧
                            const framesContainer = document.getElementById(`frames-container-${videoIndex}`);
                            
                            // 清空容器并添加帧
                            framesContainer.innerHTML = '';
                            
                            // 记录已加载的帧数
                            let loadedFrames = 0;
                            
                            data.frames.forEach((frameFile, frameIndex) => {
                                fetch(`/frames/${viewState.frameFolder}/${frameFile}`)
                                    .then(response => response.text())
                                    .then(text => {
                                        const frameElement = document.createElement('div');
                                        frameElement.className = 'frame';
                                        frameElement.textContent = text;
                                        frameElement.style.display = 'none'; // 初始隐藏所有帧
                                        framesContainer.appendChild(frameElement);
                                        viewState.frames.push(text);
                                        
                                        loadedFrames++;
                                        
                                        // 如果是第一帧，显示它
                                        if (loadedFrames === 1) {
                                            frameElement.style.display = 'block';
                                        }
                                        
                                        // 如果所有帧都加载完成
                            if (loadedFrames === data.frames.length) {
                                // 隐藏加载覆盖层
                                loadingOverlay.style.display = 'none';
                                
                                // 启用播放控制按钮
                                playBtn.disabled = false;
                                pauseBtn.disabled = false;
                                resetBtn.disabled = false;
                                
                                // 更新视图状态
                                viewState.isPlaying = false;
                                viewState.currentFrameIndex = 0;
                                viewState.isGenerating = false; // 标记生成完成，允许选择视图
                                
                                // 更新显示文本为第一帧内容
                                const asciiDisplay = document.querySelector(`#video-view-${videoIndex} .video-view-ascii`);
                                if (asciiDisplay) {
                                    asciiDisplay.textContent = viewState.frames[0];
                                }
                                
                                updateGenerationStatus('success', `视频 ${videoIndex + 1} 的帧加载完成`);
                            }
                                    })
                                    .catch(error => {
                                        console.error('加载帧失败:', error);
                                        updateGenerationStatus('error', '加载帧失败');
                                    });
                            });
                        } else if (data.status === 'error') {
                            clearInterval(frameCheckInterval);
                            loadingOverlay.style.display = 'none';
                            updateGenerationStatus('error', `加载帧失败: ${data.message}`);
                        }
                    })
                    .catch(error => {
                        console.error('检查帧状态失败:', error);
                        clearInterval(frameCheckInterval);
                        loadingOverlay.style.display = 'none';
                        updateGenerationStatus('error', '检查帧状态失败');
                    });
            }, 1000);
        }
        

        
        // 防止重复加载的标志
        let isLoadingFrames = false;
        
        // 加载现有帧
        async function loadExistingFrames() {
            if (isLoadingFrames) {
                console.log('正在加载中，跳过重复请求');
                return;
            }
            
            isLoadingFrames = true;
            renderStatus.textContent = "正在检测帧数量...";
            frames = [];
            
            // 显示加载覆盖层
            loadingOverlay.style.display = 'flex';
            loadingText.textContent = '正在检测帧文件...';
            loadingProgress.textContent = '0%';
            
            // 加载开始时禁用播放控制按钮
            setPlayControlsEnabled(false);
            
            let frameIndex = 0;
            const maxAttempts = 10000;
            let consecutiveFailures = 0;
            const maxConsecutiveFailures = 5; // 连续失败5次就停止
            
            try {
                while (frameIndex < maxAttempts && consecutiveFailures < maxConsecutiveFailures) {
                    const frameId = frameIndex.toString().padStart(5, '0');
                    const frameUrl = `/ascii_frames_${userId}/frame_${frameId}.txt`;
                    
                    try {
                        const response = await fetch(frameUrl);
                        if (response.ok) {
                            const frameContent = await response.text();
                            
                            if (isValidAsciiFrame(frameContent)) {
                                frames.push(frameContent);
                                frameIndex++;
                                consecutiveFailures = 0; // 重置失败计数
                                
                                // 更新进度显示
                                if (frameIndex % 5 === 0 || frameIndex <= 10) {
                                    const progress = Math.min((frameIndex / 100) * 100, 99);
                                    loadingProgress.textContent = `${Math.round(progress)}%`;
                                    loadingText.textContent = `正在加载... 已发现 ${frameIndex} 帧`;
                                    renderStatus.textContent = `正在加载... 已发现 ${frameIndex} 帧`;
                                    
                                    // 让UI有时间更新
                                    await new Promise(resolve => setTimeout(resolve, 1));
                                }
                            } else {
                                consecutiveFailures++;
                            }
                        } else {
                            consecutiveFailures++;
                        }
                    } catch (error) {
                        consecutiveFailures++;
                    }
                }
                
                // 隐藏加载覆盖层
                loadingOverlay.style.display = 'none';
                
                if (frames.length > 0) {
                    asciiElement.textContent = frames[0];
                    setupRenderControls();
                    // 加载完成后启用播放控制按钮
                    setPlayControlsEnabled(true);
                    loadingProgress.textContent = '100%';
                } else {
                    renderStatus.textContent = "未发现帧文件，请先生成";
                    asciiElement.textContent = "等待生成或加载ASCII动画...";
                    // 没有帧文件时保持按钮禁用状态
                    setPlayControlsEnabled(false);
                }
            } catch (error) {
                console.error('加载帧文件时发生错误:', error);
                loadingOverlay.style.display = 'none';
                renderStatus.textContent = "加载失败，请重试";
                setPlayControlsEnabled(false);
            } finally {
                isLoadingFrames = false;
            }
        }
        
        // 验证ASCII帧
        function isValidAsciiFrame(content) {
            if (!content || content.length < 10) return false;
            if (content.includes('<html') || content.includes('<!DOCTYPE')) return false;
            if (content.includes('404') || content.includes('Not Found')) return false;
            
            const validChars = /^[\x20-\x7E\n\r]*$/;
            if (!validChars.test(content)) return false;
            
            const nonWhitespaceCount = content.replace(/\s/g, '').length;
            return nonWhitespaceCount >= 5;
        }
        
        // 设置渲染控件
        function setupRenderControls() {
            // 控件已经在setupParameterControls中设置
        }
        
        // 控制播放按钮状态
        function setPlayControlsEnabled(enabled) {
            playBtn.disabled = !enabled;
            pauseBtn.disabled = !enabled;
            resetBtn.disabled = !enabled;
            
            if (enabled) {
                renderStatus.textContent = `加载完成！共 ${frames.length} 帧`;
            } else {
                renderStatus.textContent = "加载中，请等待...";
            }
        }
        
        // 动画控制函数
        function startAnimation() {
            if (isPlaying || frames.length === 0 || playBtn.disabled) return;
            
            isPlaying = true;
            playBtn.style.background = '#0d0';
            pauseBtn.style.background = '#0F0';
            
            const interval = 1000 / FRAME_RATE;
            animationInterval = setInterval(() => {
                asciiElement.textContent = frames[currentFrame];
                currentFrame = (currentFrame + 1) % frames.length;
            }, interval);
        }
        
        function pauseAnimation() {
            if (!isPlaying || pauseBtn.disabled) return;
            
            isPlaying = false;
            playBtn.style.background = '#0F0';
            pauseBtn.style.background = '#666';
            
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        }
        
        function resetAnimation() {
            if (resetBtn.disabled) return;
            
            pauseAnimation();
            currentFrame = 0;
            if (frames.length > 0) {
                asciiElement.textContent = frames[0];
            }
            playBtn.style.background = '#0F0';
            pauseBtn.style.background = '#666';
        }
        
        // 批量操作按钮事件监听器
        selectAllBtn.addEventListener('click', selectAllVideos);
        deselectAllBtn.addEventListener('click', deselectAllVideos);
        playSelectedBtn.addEventListener('click', playSelectedVideos);
        pauseSelectedBtn.addEventListener('click', pauseSelectedVideos);
        resetSelectedBtn.addEventListener('click', resetSelectedVideos);
        
        // 渲染参数更新函数
        function updateSpeed() {
            FRAME_RATE = parseInt(document.getElementById('speedSlider').value);
            
            if (isPlaying) {
                pauseAnimation();
                startAnimation();
            }
        }
        
        function updateFontSize() {
            const size = document.getElementById('fontSizeSlider').value + 'px';
            asciiElement.style.fontSize = size;
        }
        
        function updateColor() {
            asciiElement.style.color = document.getElementById('colorPicker').value;
        }
        
        function updateBgColor() {
            document.body.style.backgroundColor = document.getElementById('bgColorPicker').value;
        }
        
        function updateFontFamily() {
            asciiElement.style.fontFamily = document.getElementById('fontFamily').value;
        }
        
        function updateOpacity() {
            const opacity = parseFloat(document.getElementById('opacitySlider').value);
            asciiElement.style.opacity = opacity;
        }
        
        function updateContrast() {
            const contrast = parseFloat(document.getElementById('contrastSlider').value);
            asciiElement.style.filter = `contrast(${contrast})`;
        }
    </script>
</body>
