<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Animation</title>
    <style>
        body {
            background-color: #000;
            color: #0F0;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .ascii-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #ascii-art {
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            line-height: 1.0;
            white-space: pre;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .controls {
            width: 280px;
            background: rgba(20, 20, 20, 0.9);
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            border-left: 1px solid #333;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
        }
        
        .control-group input, .control-group select {
            width: 100%;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        
        .control-group input[type="range"] {
            height: 6px;
            background: #333;
            outline: none;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: #0F0;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .control-group input[type="color"] {
            height: 40px;
            border: none;
            cursor: pointer;
        }
        
        .value-display {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        .play-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 10px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
        }
        
        .btn:hover {
            background: #444;
        }
        
        .btn.active {
            background: #0F0;
            color: #000;
        }
        
        .status {
            padding: 10px;
            background: rgba(15, 255, 15, 0.1);
            border: 1px solid #0F0;
            border-radius: 4px;
            color: #0F0;
            font-size: 12px;
            text-align: center;
        }
        
        h3 {
            color: #0F0;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ascii-container">
            <pre id="ascii-art">Loading animation...</pre>
        </div>
        
        <div class="controls">
            <h3>ASCII 动效控制</h3>
            
            <div class="play-controls">
                <button class="btn" id="playBtn">播放</button>
                <button class="btn" id="pauseBtn">暂停</button>
                <button class="btn" id="resetBtn">重置</button>
            </div>
            
            <div class="control-group">
                <label for="speedSlider">播放速度 (FPS)</label>
                <input type="range" id="speedSlider" min="1" max="60" value="30">
                <div class="value-display" id="speedValue">30 FPS</div>
            </div>
            
            <div class="control-group">
                <label for="fontSizeSlider">字体大小</label>
                <input type="range" id="fontSizeSlider" min="6" max="20" value="10">
                <div class="value-display" id="fontSizeValue">10px</div>
            </div>
            
            <div class="control-group">
                <label for="colorPicker">字符颜色</label>
                <input type="color" id="colorPicker" value="#00FF00">
            </div>
            
            <div class="control-group">
                <label for="bgColorPicker">背景颜色</label>
                <input type="color" id="bgColorPicker" value="#000000">
            </div>
            
            <div class="control-group">
                <label for="fontFamily">字体</label>
                <select id="fontFamily">
                    <option value="'Courier New', Courier, monospace">Courier New</option>
                    <option value="'Monaco', 'Menlo', monospace">Monaco</option>
                    <option value="'Consolas', monospace">Consolas</option>
                    <option value="'Lucida Console', monospace">Lucida Console</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="opacitySlider">透明度</label>
                <input type="range" id="opacitySlider" min="0.1" max="1" step="0.1" value="1">
                <div class="value-display" id="opacityValue">100%</div>
            </div>
            
            <div class="control-group">
                <label for="contrastSlider">对比度</label>
                <input type="range" id="contrastSlider" min="0.5" max="2" step="0.1" value="1">
                <div class="value-display" id="contrastValue">100%</div>
            </div>
            
            <div class="status" id="status">
                准备就绪
            </div>
        </div>
    </div>

    <script>
        // --- 配置 ---
        let FRAME_COUNT = 720; // 根据实际生成的文件数动态调整
        let FRAME_RATE = 30;
        
        const frames = [];
        const framePromises = [];
        let animationInterval = null;
        let currentFrame = 0;
        let isPlaying = false;
        
        // DOM 元素引用
        const asciiElement = document.getElementById('ascii-art');
        const statusElement = document.getElementById('status');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        
        // 控制元素
        const speedSlider = document.getElementById('speedSlider');
        const fontSizeSlider = document.getElementById('fontSizeSlider');
        const colorPicker = document.getElementById('colorPicker');
        const bgColorPicker = document.getElementById('bgColorPicker');
        const fontFamily = document.getElementById('fontFamily');
        const opacitySlider = document.getElementById('opacitySlider');
        const contrastSlider = document.getElementById('contrastSlider');
        
        // 1. 异步加载所有文本帧
        async function loadFrames() {
            statusElement.textContent = "正在加载帧数据...";
            console.log("Loading frames...");
            
            // 先尝试检测实际的帧数
            let actualFrameCount = 0;
            for (let i = 0; i < FRAME_COUNT; i++) {
                const frameId = i.toString().padStart(5, '0');
                const frameUrl = `./ascii_frames/frame_${frameId}.txt`;
                
                try {
                    const response = await fetch(frameUrl);
                    if (response.ok) {
                        const frameContent = await response.text();
                        frames.push(frameContent);
                        actualFrameCount++;
                        statusElement.textContent = `加载中... ${actualFrameCount}/${FRAME_COUNT}`;
                    } else {
                        break;
                    }
                } catch (error) {
                    console.warn(`Failed to load frame ${i}:`, error);
                    break;
                }
            }
            
            if (frames.length > 0) {
                FRAME_COUNT = frames.length;
                statusElement.textContent = `加载完成！共 ${FRAME_COUNT} 帧`;
                console.log(`All ${FRAME_COUNT} frames loaded successfully!`);
                setupControls();
            } else {
                statusElement.textContent = "加载失败，请检查文件路径";
                console.error("No frames loaded");
            }
        }
        
        // 2. 设置控制事件
        function setupControls() {
            // 播放控制
            playBtn.addEventListener('click', startAnimation);
            pauseBtn.addEventListener('click', pauseAnimation);
            resetBtn.addEventListener('click', resetAnimation);
            
            // 实时参数调整
            speedSlider.addEventListener('input', updateSpeed);
            fontSizeSlider.addEventListener('input', updateFontSize);
            colorPicker.addEventListener('input', updateColor);
            bgColorPicker.addEventListener('input', updateBgColor);
            fontFamily.addEventListener('change', updateFontFamily);
            opacitySlider.addEventListener('input', updateOpacity);
            contrastSlider.addEventListener('input', updateContrast);
            
            // 初始化显示第一帧
            asciiElement.textContent = frames[0];
        }
        
        // 3. 动画控制函数
        function startAnimation() {
            if (isPlaying) return;
            
            isPlaying = true;
            playBtn.classList.add('active');
            pauseBtn.classList.remove('active');
            
            const interval = 1000 / FRAME_RATE;
            animationInterval = setInterval(() => {
                asciiElement.textContent = frames[currentFrame];
                currentFrame = (currentFrame + 1) % frames.length;
            }, interval);
        }
        
        function pauseAnimation() {
            if (!isPlaying) return;
            
            isPlaying = false;
            playBtn.classList.remove('active');
            pauseBtn.classList.add('active');
            
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        }
        
        function resetAnimation() {
            pauseAnimation();
            currentFrame = 0;
            asciiElement.textContent = frames[0];
            playBtn.classList.remove('active');
            pauseBtn.classList.remove('active');
        }
        
        // 4. 参数更新函数
        function updateSpeed() {
            FRAME_RATE = parseInt(speedSlider.value);
            document.getElementById('speedValue').textContent = `${FRAME_RATE} FPS`;
            
            if (isPlaying) {
                pauseAnimation();
                startAnimation();
            }
        }
        
        function updateFontSize() {
            const size = fontSizeSlider.value + 'px';
            asciiElement.style.fontSize = size;
            document.getElementById('fontSizeValue').textContent = size;
        }
        
        function updateColor() {
            asciiElement.style.color = colorPicker.value;
        }
        
        function updateBgColor() {
            document.body.style.backgroundColor = bgColorPicker.value;
        }
        
        function updateFontFamily() {
            asciiElement.style.fontFamily = fontFamily.value;
        }
        
        function updateOpacity() {
            const opacity = parseFloat(opacitySlider.value);
            asciiElement.style.opacity = opacity;
            document.getElementById('opacityValue').textContent = Math.round(opacity * 100) + '%';
        }
        
        function updateContrast() {
            const contrast = parseFloat(contrastSlider.value);
            asciiElement.style.filter = `contrast(${contrast})`;
            document.getElementById('contrastValue').textContent = Math.round(contrast * 100) + '%';
        }
        
        // 启动应用
        loadFrames();
    </script>
</body>
</html>
